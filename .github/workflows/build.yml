name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: make install

      - name: Build
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aos
          path: |
            aos.iso
            aos.elf

  # Fast regression suite (ipctest + musl Linux tests). Full GUI tests
  # (notepadtest, guiterster) are run locally by the human, not in CI.
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: make install

      - name: Build ISO
        run: make

      - name: Run fast tests
        run: make test-fast
